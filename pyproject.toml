[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqi-ccgt-hrsg-creep-pinn"
version = "0.1.0"
description = "Combined Cycle HRSG Superheater Tube Creep-Fatigue Damage under Severe Iraqi Peaking Cycling with Continuum Damage PINNs"
authors = [{ name = "Mohammed Basra", email = "researcher@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]
